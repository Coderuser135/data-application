name: CI

on:
  push:
    branches: [main, production/auth-session-hardening, backend/simple-mvc-refactor, feature/store-order-fulfillment]
  pull_request:
    branches: [main, production/auth-session-hardening, backend/simple-mvc-refactor]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Validate backend syntax
        working-directory: backend
        run: find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
